name: Kiểm tra toàn vẹn hằng ngày

# Dữ liệu được ghi trực tiếp từ trình duyệt nên vẫn có thể lệch nếu ai đó
# sửa file bằng tay hoặc một lần ghi bị đứt giữa chừng. Workflow này quét
# mỗi ngày và mở issue khi phát hiện vấn đề (SRS FR-ADMIN-06).

on:
  schedule:
    - cron: '0 1 * * *'   # 01:00 UTC ≈ 08:00 giờ Việt Nam
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Kiểm tra toàn vẹn
        id: validate
        continue-on-error: true
        run: |
          {
            echo 'report<<REPORT_EOF'
            node scripts/validate-data.mjs 2>&1 || true
            echo 'REPORT_EOF'
          } >> "$GITHUB_OUTPUT"
          node scripts/validate-data.mjs > /dev/null 2>&1

      - name: Mở issue khi phát hiện lỗi
        if: steps.validate.outcome == 'failure'
        uses: actions/github-script@v7
        env:
          REPORT: ${{ steps.validate.outputs.report }}
        with:
          script: |
            const title = 'Dữ liệu không toàn vẹn';
            const body = [
              'Lần quét tự động phát hiện dữ liệu trong `data/` có vấn đề.',
              '',
              '```',
              process.env.REPORT || '(không có nội dung)',
              '```',
              '',
              'Chi tiết các quy tắc: `docs/SRS.md` §5.4 (INT-01…INT-12).',
              '',
              `Lần chạy: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');

            // Gộp vào issue đang mở nếu có, tránh tạo issue mới mỗi ngày.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'data-integrity',
            });

            if (existing.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['data-integrity'],
              });
            }
